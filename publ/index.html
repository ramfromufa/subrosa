<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Базовые метатеги для поисковиков -->
    <title>Клиентское AI-приложение с полным шифрованием</title>
    <meta name="description" content="Веб-приложение нового поколения, созданное искусственным интеллектом. Работает исключительно в вашем браузере (Client-Side HTML/JS). Полное сквозное шифрование данных: приватность по умолчанию.">
    <meta name="keywords" content="client-side app, local javascript, ai generated web, encrypted data, html5, zero-knowledge, автономный сайт">
    <meta name="robots" content="index, follow">

    <!-- Защита от индексации конфиденциальных данных (на всякий случай) -->
    <meta name="referrer" content="no-referrer">

    <!-- Микроразметка Open Graph (для красивых ссылок в Telegram, Discord, VK) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Автономное Client-Side Приложение">
    <meta property="og:description" content="Код написан ИИ, исполняется только в браузере. Данные полностью зашифрованы и не уходят на сервер.">
    <meta property="og:url" content="https://ramfromufa.com">
    <meta property="og:image" content="https://ramfromufa.com">

    <!-- Техническая адаптивность под мобильные устройства -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; margin: 40px; }
        h1, h2, h3, h4, h5, h6 {font-family: "Segoe UI", Arial, sans-serif;}
        .container { max-width: 500px; margin: 0 auto; }
        input { padding: 8px; width: 60%; }
        button { padding: 8px 15px; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Распродажа деревянных членов ГКЧП СССР. Вводи промокод, Товарищ!</h2>
    <label for="numberInput">Только циферки, контингент не надо. Например, количество ягуаров в гараже или личном зоопарке.</label></br></br>
    <input type="number" id="numberInput" placeholder="00111111">
    <button onclick="checkHash()">Нажми на кнопку</button>
    
    <div id="result"></div>
    </br></br>
    <!-- Кнопка копирования -->
    <button id="copyBtn">И скопируй результат</button></br></br>
    <img src="001.png" alt="Ширли-мырли" style="width: 100%; height: auto;">
</div>

<script>
document.getElementById('numberInput').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        checkHash();
    }
});

</script>

<script>
  // Находим элементы на странице
  const resultText = document.getElementById('result');
  const copyButton = document.getElementById('copyBtn');

  // Вешаем обработчик клика на кнопку
  copyButton.addEventListener('click', () => {
    // Получаем текст из элемента
    const textToCopy = resultText.innerText;

    // Копируем текст в буфер обмена
    navigator.clipboard.writeText(textToCopy)
      .then(() => {
        // Меняем текст кнопки для визуального отклика
        copyButton.textContent = 'Скопировано!';
        
        // Возвращаем исходный текст кнопки через 2 секунды
        setTimeout(() => {
          copyButton.textContent = 'Копировать результат';
        }, 2000);
      })
      .catch(err => {
        console.error('Ошибка при копировании: ', err);
      });
  });
</script>

<script src="./index.js" charset="UTF-8"></script>

</body>
</html>
